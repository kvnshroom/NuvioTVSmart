# Publish the VIDAA build to GitHub Pages, so a launcher tile has a stable
# https address to open, for free, so users do not have to self-host.
# Runs on every push to main (and manually); the site is public.
name: Publish VIDAA build to Pages

on:
  workflow_dispatch:
  push:
    branches: [main, pages-test]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Forks usually have Pages off; deploying there just fails. Run only in
    # the original repo, or in a fork whose owner set the repository
    # variable ENABLE_PAGES=true (after turning on Pages via GitHub Actions).
    if: github.repository_owner == 'derpwinnie' || github.repository_owner == 'kvnshroom' || vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser-hosted build cannot read api.introdb.app directly (its CORS
      # only allows introdb.app). With the repository variable INTRODB_PROXY_URL
      # set, skip-intro data goes through the proxy in tools/introdb-proxy.
      - name: Point IntroDB at the CORS proxy
        if: vars.INTRODB_PROXY_URL != ''
        env:
          INTRODB_PROXY_URL: ${{ vars.INTRODB_PROXY_URL }}
        run: |
          cp local.example.properties local.properties
          printf '\nINTRODB_API_URL=%s\n' "${INTRODB_PROXY_URL}" >> local.properties
      # package:vidaa builds the static VIDAA bundle into dist/vidaa
      # (vidaa.html, sw.js, hashed file names).
      - run: npm run package:vidaa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vidaa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
