# Build the VIDAA tile tool as one double-clickable program per OS.
# Push to main that touches the tool: build and publish a release
#   (tag vidaa-tile-v1.0.<run number>, created by the workflow).
# Tag `vidaa-tile-vX.Y.Z` pushed by hand: release under that name.
# Manual run / pull request: build only; programs are under "Artifacts".
name: VIDAA tile tool

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["vidaa-tile-v*"]
    paths:
      - "tools/vidaa-tile/**"
      - "scripts/build-vidaa-tile.mjs"
      - ".github/workflows/vidaa-tile-release.yml"
  pull_request:
    paths:
      - "tools/vidaa-tile/**"
      - "scripts/build-vidaa-tile.mjs"
      - "tests/test-vidaa-tile-*.mjs"
      - ".github/workflows/vidaa-tile-release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:vidaa:tile

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: windows-latest
          - runner: macos-latest # Apple Silicon
          - runner: macos-15-intel # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-vidaa-tile.mjs
      # Smoke test: the built program starts, prints its help, and its bundled
      # mqtt library loads and builds a CONNECT packet (help alone never loads it).
      - name: Smoke test
        shell: bash
        run: |
          exe=$(ls dist/vidaa-tile/nuvio-vidaa-tile-*)
          "./$exe" --help | grep -q import-sidee
          "./$exe" selftest | grep -q "selftest ok"
      - uses: actions/upload-artifact@v4
        with:
          name: vidaa-tile-${{ runner.os }}-${{ runner.arch }}
          path: dist/vidaa-tile/nuvio-vidaa-tile-*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/vidaa-tile-v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="vidaa-tile-v1.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "VIDAA tile tool ${tag#vidaa-tile-}" \
            --notes "Download the file for your computer and double-click it. The dashboard opens in your browser. Windows: nuvio-vidaa-tile-windows-x64.exe. Mac: arm64 for M-series, x64 for Intel (first launch: System Settings → Privacy & Security → Open Anyway). Linux: chmod +x, then run it."
